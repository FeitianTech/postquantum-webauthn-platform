# Mirrors the Cloud Build trigger "postquantum-webauthn-platform" (push to main),
# which builds the image and rolls it out to Cloud Run.
#
# The deploy step only changes the image. Service settings (concurrency,
# scaling, secrets, service account) live in deploy/service.yaml and are applied
# with deploy/apply-service-config.sh. It deploys the image as a revision that
# takes no traffic, checks /health, / and /api/mds/metadata/info at its tag's URL,
# and only then sends it all the traffic (deploy/deploy-revision.sh): whatever
# fails leaves the traffic on the revision that had it.
#
# GitHub Actions and Cloud Build are independent pipelines: a red CI run does
# not stop a trigger from firing. The test steps below (ruff, the Python suite
# with its coverage floor, and the UI's checks) are therefore the gate that
# actually stands between a commit on main and production. They run first
# and in parallel; Build waits for both, so a failing suite fails the build
# before an image is ever pushed. The Playwright browser tests run in GitHub CI
# only (ci-web.yml).

steps:
  - name: python:3.12-slim
    id: Python tests
    waitFor: ['-']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # The same uv version the image and CI install from uv.lock with.
        pip install --no-cache-dir --quiet "uv==0.12.15"
        uv sync --locked --python 3.12
        # ruff's gated set (ruff.toml), the version CI runs.
        uvx ruff@0.16.8 check .
        # The suite under coverage, held to .coveragerc's fail_under.
        .venv/bin/python -m coverage run -m pytest -q
        .venv/bin/python -m coverage report

  # The UI (web/): typecheck, its unit tests and its logic's with their
  # coverage floors, the static export, the export's CSP scan and its size
  # budget. The image builds web/ again in its own stage (and scans it again);
  # this step is the gate, and fails before any image exists.
  - name: node:22-slim
    id: Web tests
    waitFor: ['-']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        cd web
        npm ci --no-audit --no-fund
        npm run typecheck
        npm run test:coverage
        npm run build
        npm run check:csp
        npm run check:size

  - name: gcr.io/cloud-builders/docker
    id: Build
    waitFor:
      - Python tests
      - Web tests
    args:
      - build
      - -t
      - asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/postquantum-webauthn-platform/pqcwebauthn:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    id: Push
    args:
      - push
      - asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/postquantum-webauthn-platform/pqcwebauthn:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy
    entrypoint: bash
    args: [deploy/deploy-revision.sh]
    # Substitutions are not environment variables: the script is given what it needs.
    env:
      - IMAGE=asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/postquantum-webauthn-platform/pqcwebauthn:$COMMIT_SHA
      - SERVICE=pqcwebauthn
      - REGION=asia-northeast1
      - COMMIT_SHA=$COMMIT_SHA
      - BUILD_ID=$BUILD_ID
      - LABELS=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID

images:
  - asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/postquantum-webauthn-platform/pqcwebauthn:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
  # The production trigger defines substitutions (_AR_HOSTNAME, _SERVICE_NAME, ...)
  # that this file does not use. Cloud Build rejects a build with unused
  # substitutions unless they are allowed loosely. _TRIGGER_ID is used, for the
  # label that links the Cloud Run service to its trigger; a manual build leaves it empty.
  substitutionOption: ALLOW_LOOSE

# The gate takes about 20 minutes; the deploy's checks up to 8 more.
timeout: 2100s
