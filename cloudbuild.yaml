# Mirrors the Cloud Build trigger "postquantum-webauthn-platform" (push to main),
# which builds the image and rolls it out to Cloud Run.
#
# The deploy step only changes the image. Service settings (concurrency,
# scaling, secrets, service account) live in deploy/service.yaml and are applied
# with deploy/apply-service-config.sh.
#
# GitHub Actions and Cloud Build are independent pipelines: a red CI run does
# not stop a trigger from firing. The test steps below are therefore the gate
# that actually stands between a commit on main and production. They run first
# and in parallel; Build waits for all three, so a failing suite fails the build
# before an image is ever pushed. The Playwright browser tests run in GitHub CI
# only (ci-web.yml) until the cutover; see docs/UI_MIGRATION.md.

steps:
  - name: python:3.12-slim
    id: Python tests
    waitFor: ['-']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # The same uv version the image and CI install from uv.lock with.
        pip install --no-cache-dir --quiet "uv==0.12.15"
        uv sync --locked --python 3.12
        .venv/bin/python -m pytest -q

  # node:22-slim: jsdom 30 pulls undici 8, which needs Node 22 or newer.
  - name: node:22-slim
    id: Frontend tests
    waitFor: ['-']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        npm ci
        npm run test:frontend

  # The new UI (web/, docs/UI_MIGRATION.md): typecheck, its unit tests with
  # their coverage floors, the static export, and the export's CSP scan. The
  # image builds web/ again in its own stage (and scans it again); this step is
  # the gate, and fails before any image exists.
  - name: node:22-slim
    id: Web tests
    waitFor: ['-']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        cd web
        npm ci --no-audit --no-fund
        npm run typecheck
        npm run test:coverage
        npm run build
        npm run check:csp

  - name: gcr.io/cloud-builders/docker
    id: Build
    waitFor:
      - Python tests
      - Frontend tests
      - Web tests
    args:
      - build
      - -t
      - asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/postquantum-webauthn-platform/pqcwebauthn:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    id: Push
    args:
      - push
      - asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/postquantum-webauthn-platform/pqcwebauthn:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - pqcwebauthn
      - --platform=managed
      - --image=asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/postquantum-webauthn-platform/pqcwebauthn:$COMMIT_SHA
      - --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID
      - --region=asia-northeast1
      - --quiet

images:
  - asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/postquantum-webauthn-platform/pqcwebauthn:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
  # The production trigger defines substitutions (_AR_HOSTNAME, _SERVICE_NAME, ...)
  # that this file does not use. Cloud Build rejects a build with unused
  # substitutions unless they are allowed loosely. _TRIGGER_ID is used, for the
  # label that links the Cloud Run service to its trigger; a manual build leaves it empty.
  substitutionOption: ALLOW_LOOSE

timeout: 1500s
