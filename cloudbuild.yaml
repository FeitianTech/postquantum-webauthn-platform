# Google Cloud Deployment Configuration File

steps:
  # Build Docker image with BuildKit
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Docker Image'
    env:
      - 'DOCKER_BUILDKIT=1'          # Enable BuildKit
      - 'BUILDKIT_PROGRESS=plain'    # Show detailed logs (optional)
    args:
      [
        'build',
        '-t', 'gcr.io/$PROJECT_ID/pqc-webauthn',
        '.'
      ]

  # Push the image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Image'
    args:
      [
        'push',
        'gcr.io/$PROJECT_ID/pqc-webauthn'
      ]

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy to Cloud Run'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy pqc-webauthn \
          --image gcr.io/$PROJECT_ID/pqc-webauthn \
          --region us-central1 \
          --platform managed \
          --cpu=2 \
          --memory=512Mi \
          --cpu-boost \
          --port=8080 \
          --allow-unauthenticated \
          --min-instances=1 \
          --max-instances=40 \
          --update-env-vars=GITHUB_LOG_REPO_OWNER=rainzhang05,GITHUB_LOG_REPO_NAME=CredentialLogs,GITHUB_LOG_ASYNC=0,FIDO_SERVER_STARTUP_MODE=fast,FIDO_SERVER_SESSION_METADATA_CLEANUP_ASYNC=1,FIDO_SERVER_EAGER_INDEX_METADATA_BOOTSTRAP=0 \
          --execution-environment=gen2 \
          --project $PROJECT_ID

images:
  - 'gcr.io/$PROJECT_ID/pqc-webauthn'

# Optional timeout
timeout: '1500s'
