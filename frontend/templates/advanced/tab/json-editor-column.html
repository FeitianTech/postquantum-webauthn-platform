<div class="json-editor-column">
    <div id="json-editor-section" class="settings-section-sentinel" data-scroll-target="json-editor-container"></div>
    <div class="column-card json-editor-card">
        <h3>JSON Editor</h3>
        <div id="json-editor-container" class="json-editor inline-json-editor expanded" aria-expanded="true">
            <div class="json-editor-actions">
                <div class="json-editor-inline-buttons">
                    <button class="btn" onclick="saveJsonEditor()" title="Save JSON changes to settings">Save</button>
                    <button class="btn btn-secondary" onclick="resetJsonEditor()" title="Reset JSON to match current settings">Reset</button>
                </div>
                <button type="button" id="json-editor-close" class="json-editor-close-btn" title="Close JSON editor" aria-label="Close JSON editor">
                    <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                        <path d="M4 4l8 8" />
                        <path d="M12 4 4 12" />
                    </svg>
                </button>
            </div>
            <textarea id="json-editor" placeholder="JSON representation will appear here automatically..." spellcheck="false"
                      autocapitalize="off" autocomplete="off" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false"></textarea>
        </div>
    </div>
</div>
