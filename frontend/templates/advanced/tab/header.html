<div class="advanced-header">
    <div class="advanced-header__title-row">
        <h2>Advanced Authentication</h2>
        <div class="advanced-header__actions">
            <div class="advanced-header__actions-group active" data-subtab="registration">
                <button class="btn" data-action="advanced-register">Create Credential</button>
                <button type="button" class="btn btn-secondary" data-action="reset-registration-form">Reset</button>
            </div>
            <div class="advanced-header__actions-group" data-subtab="authentication">
                <button class="btn" data-action="advanced-authenticate">Assert Credential</button>
                <button type="button" class="btn btn-secondary" data-action="reset-authentication-form">Reset</button>
            </div>
        </div>
    </div>
    <p class="tab-section-description">Configure WebAuthn registration and authentication requests with detailed settings.</p>
    <div class="advanced-header__meta">
        <div class="status" id="advanced-status"></div>
        <div class="sub-tabs">
            <button id="registration-tab-btn" class="sub-tab active" data-action="switch-sub-tab" data-sub-tab="registration">Registration</button>
            <button id="authentication-tab-btn" class="sub-tab" data-action="switch-sub-tab" data-sub-tab="authentication">Authentication</button>
        </div>
    </div>
    <div class="ceremony-result" id="advanced-ceremony-result" role="status" aria-live="polite" hidden></div>
</div>
