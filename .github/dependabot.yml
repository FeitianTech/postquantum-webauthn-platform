version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # web/package-lock.json is what npm audit in ci-security.yml gates on. The
  # site stays on Next.js 15, and TypeScript on 5, which Next 15's build checks
  # with.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # uv.lock is the Python lockfile the image, CI and local venvs install from.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "python"
        versions:
          - ">=3.13"
      # fido2 is pinned exactly: the app reads its data classes and CTAP
      # tables, and a major release has changed both (2.0). Minor and patch
      # releases come as pull requests; a major waits for a deliberate move.
      - dependency-name: "fido2"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "python"
        versions:
          - ">=3.13"
      # The web stage builds on Node 22, as CI and Cloud Build do.
      - dependency-name: "node"
        versions:
          - ">=23"
