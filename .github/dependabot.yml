version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # web/package-lock.json is what npm audit in ci-security.yml gates on. The
  # site stays on Next.js 15, and TypeScript on 5, which Next 15's build checks
  # with.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # uv.lock is the Python lockfile the image, CI and local venvs install from.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "python"
        versions:
          - ">=3.13"
      # fido2 is the vendored copy in this repo, not the PyPI package of the
      # same name. Dependabot fails the whole uv run trying to resolve it
      # ("fido2 | unknown_error"), and a bump would replace local source.
      - dependency-name: "fido2"
      # The root pyproject.toml is fido2's Poetry manifest; its optional
      # pyscard table fails every uv run ("Declaration not found for pyscard!").
      # Until fido2 leaves the repository.
      - dependency-name: "pyscard"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "python"
        versions:
          - ">=3.13"
      # The web stage builds on Node 22, as CI and Cloud Build do.
      - dependency-name: "node"
        versions:
          - ">=23"
