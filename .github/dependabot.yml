version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # package-lock.json is what npm audit in ci-security.yml gates on.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # uv.lock is the Python lockfile the image, CI and local venvs install from.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "python"
        versions:
          - ">=3.13"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "python"
        versions:
          - ">=3.13"
