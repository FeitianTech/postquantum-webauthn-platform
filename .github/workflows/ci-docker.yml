name: CI / Docker Build

on:
  # push is filtered to main so a same-repo PR is checked once (by
  # pull_request) instead of twice; main still gets a post-merge run.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build -t pqc-webauthn .

      - name: Start container and check it serves requests
        run: |
          docker run -d --name pqc-webauthn -p 8080:8080 \
            -e PORT=8080 \
            -e FIDO_SERVER_GCS_ENABLED=0 \
            -e FIDO_SERVER_SECRET_KEY=ci-only-secret \
            pqc-webauthn
          start=$(date +%s)
          until curl -fsS http://localhost:8080/health > /dev/null; do
            if [ $(( $(date +%s) - start )) -gt 20 ]; then
              echo "Container did not become ready within 20 seconds."
              docker logs pqc-webauthn
              exit 1
            fi
            sleep 0.2
          done
          echo "Ready after $(( $(date +%s) - start ))s"
          curl -fsS -o /dev/null -w 'GET / status=%{http_code} ttfb=%{time_starttransfer}s\n' http://localhost:8080/
          main_js=$(curl -fsS http://localhost:8080/ | grep -o '/assets/[^"]*/scripts/main.js' | head -1)
          curl -fsS -D - -o /dev/null -H 'Accept-Encoding: gzip' "http://localhost:8080${main_js}" \
            | grep -i -E '^(cache-control: public, max-age=31536000, immutable|content-encoding: gzip)'
          # The new UI at /beta (docs/UI_MIGRATION.md): the export is in the image,
          # its HTML revalidates, and its hashed assets are immutable and gzipped.
          curl -fsS -D /tmp/beta.headers -o /tmp/beta.html http://localhost:8080/beta
          grep -qi '^cache-control: no-cache' /tmp/beta.headers
          curl -fsS -o /dev/null http://localhost:8080/beta/design
          chunk=$(grep -o '/beta/_next/static/chunks/[^"]*\.js' /tmp/beta.html | head -1)
          test -n "$chunk"
          curl -fsS -D /tmp/chunk.headers -o /dev/null -H 'Accept-Encoding: gzip' "http://localhost:8080${chunk}"
          grep -qi '^cache-control: public, max-age=31536000, immutable' /tmp/chunk.headers
          grep -qi '^content-encoding: gzip' /tmp/chunk.headers
          echo "/beta serves the export: ${chunk} is immutable and gzipped"

      - name: Show container logs
        if: always()
        run: docker logs pqc-webauthn || true
