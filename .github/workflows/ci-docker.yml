name: CI / Docker Build

on:
  # push is filtered to main so a same-repo PR is checked once (by
  # pull_request) instead of twice; main still gets a post-merge run.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build -t pqc-webauthn .

      - name: Start container and check it serves requests
        run: |
          # The MDS fixture's snapshot, read-only: the server finds every file and writes none.
          docker run -d --name pqc-webauthn -p 8080:8080 \
            -e PORT=8080 \
            -e FIDO_SERVER_GCS_ENABLED=0 \
            -e FIDO_SERVER_SECRET_KEY=ci-only-secret \
            -e FIDO_SERVER_MDS_SNAPSHOT_DIR=/srv/mds \
            -v "$PWD/tests/fixtures/mds/snapshot:/srv/mds:ro" \
            pqc-webauthn
          start=$(date +%s)
          until curl -fsS http://localhost:8080/health > /dev/null; do
            if [ $(( $(date +%s) - start )) -gt 20 ]; then
              echo "Container did not become ready within 20 seconds."
              docker logs pqc-webauthn
              exit 1
            fi
            sleep 0.2
          done
          echo "Ready after $(( $(date +%s) - start ))s"
          curl -fsS -o /dev/null -w 'GET / status=%{http_code} ttfb=%{time_starttransfer}s\n' http://localhost:8080/
          # The site is the UI's static export (docs/DESIGN.md): it is in the
          # image, its HTML revalidates, and its hashed assets are immutable and gzipped.
          curl -fsS -D /tmp/index.headers -o /tmp/index.html http://localhost:8080/
          grep -qi '^cache-control: no-cache' /tmp/index.headers
          curl -fsS -o /dev/null http://localhost:8080/favicon.ico
          curl -fsS -o /dev/null http://localhost:8080/favicon.svg
          chunk=$(grep -o '/_next/static/chunks/[^"]*\.js' /tmp/index.html | head -1)
          test -n "$chunk"
          curl -fsS -D /tmp/chunk.headers -o /dev/null -H 'Accept-Encoding: gzip' "http://localhost:8080${chunk}"
          grep -qi '^cache-control: public, max-age=31536000, immutable' /tmp/chunk.headers
          grep -qi '^content-encoding: gzip' /tmp/chunk.headers
          echo "/ serves the export: ${chunk} is immutable and gzipped"
          # No other site's window or page gets a handle on it or loads it.
          grep -qi '^cross-origin-opener-policy: same-origin' /tmp/index.headers
          grep -qi '^cross-origin-resource-policy: same-origin' /tmp/index.headers
          # The server runs unprivileged and can write where it writes at run time.
          test "$(docker exec pqc-webauthn id -u)" = 10001
          docker exec pqc-webauthn sh -c 'mkdir -p /app/instance/written && rmdir /app/instance/written'
          # The allocator settings that give back a burst of large requests' memory (Dockerfile).
          test "$(docker exec pqc-webauthn printenv MALLOC_ARENA_MAX MALLOC_MMAP_THRESHOLD_ | xargs)" = "1 131072"
          # The MDS explorer's files, which need the snapshot: the list and one entry.
          curl -fsS -o /tmp/info.json http://localhost:8080/api/mds/metadata/info
          curl -fsS -o /tmp/list.json http://localhost:8080/assets/mds/fido-mds3.explorer.list.json
          entry=$(python3 -c 'import json, sys; info, rows = (json.load(open(path)) for path in sys.argv[1:]); assert info["entryCount"] > 0; print(rows["entries"][0]["detailUrl"])' /tmp/info.json /tmp/list.json)
          curl -fsS -o /dev/null "http://localhost:8080${entry}"
          echo "uid 10001 serves the MDS explorer: ${entry}"

      - name: Show container logs
        if: always()
        run: docker logs pqc-webauthn || true
