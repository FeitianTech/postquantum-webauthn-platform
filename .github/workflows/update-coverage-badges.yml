name: Update coverage badges

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-coverage-badges
  cancel-in-progress: true

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage pytest

      - name: Python coverage
        run: |
          coverage run -m pytest -q -p no:cov
          coverage json -o "$GITHUB_WORKSPACE/pycov.json"

      - name: Install frontend dependencies and frontend coverage
        run: |
          npm install
          npm run test:frontend:coverage

      - name: Generate shields endpoint JSON
        env:
          PYTHON_COVERAGE_JSON: ${{ github.workspace }}/pycov.json
        run: python scripts/generate_coverage_badges.py

      - name: Commit badge files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/
          if git diff --staged --quiet; then
            echo "Coverage badges already up to date."
          else
            git commit -m "chore: update coverage badges [skip ci]"
            git push
          fi
