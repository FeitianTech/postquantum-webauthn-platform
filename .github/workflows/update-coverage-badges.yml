name: Update coverage badges

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents: write pushes the bot branch only. The badge update reaches main
# through a reviewed pull request, so it cannot skip CI on its way to a deploy.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: coverage-badges-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"

      - name: Install Python dependencies
        run: |
          uv sync --locked --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm ci

      - name: Regenerate coverage badges
        run: npm run coverage:badges

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- .github/badges/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a pull request with the new badges
        if: steps.changes.outputs.changed == 'true'
        uses: ./.github/actions/open-bot-pr
        with:
          branch: bot/coverage-badges
          commit-message: "Update coverage badge JSON"
          paths: .github/badges/
          title: "Update coverage badge JSON"
          body: |
            Regenerated by the `Update coverage badges` workflow from the
            coverage of the current `main`.

            Only `.github/badges/` is touched.
          token: ${{ secrets.BOT_PR_TOKEN || secrets.GITHUB_TOKEN }}
