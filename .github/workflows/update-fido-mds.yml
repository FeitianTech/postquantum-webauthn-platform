name: Update FIDO MDS Snapshot

on:
  schedule:
    - cron: '0 0 * * *'  # daily at 00:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # REQUIRED for git push with GITHUB_TOKEN

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.15"

      - name: Install dependencies
        run: |
          uv sync --locked --no-dev --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Refresh packaged metadata snapshot
        run: python tools/update_mds_snapshot.py

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No metadata updates detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update FIDO MDS snapshot"
          git push
