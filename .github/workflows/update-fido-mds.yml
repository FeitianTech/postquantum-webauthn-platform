name: Update FIDO MDS Snapshot

on:
  schedule:
    - cron: '17 */12 * * *'  # twice a day
  workflow_dispatch:

# Downloads the FIDO Alliance's metadata BLOB, verifies its signature chain
# against the pinned GlobalSign R46 root, and publishes it to the bucket as a new
# snapshot set when its serial is above the pointer's (docs/MDS_SNAPSHOT.md).
# Running instances take the new set within 15 minutes. Nothing is written to
# the repository. Google credentials come from Workload Identity Federation: the
# pool accepts only this repository's main branch, and the mds-publisher account
# may write only under mds/ in the bucket (deploy/README.md). No key is stored.
permissions:
  contents: read
  id-token: write

# A publish in progress finishes: another run waits rather than cancelling it.
concurrency:
  group: fido-mds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15"

      - name: Install dependencies
        run: |
          uv sync --locked --no-dev --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_MDS_PUBLISHER_SERVICE_ACCOUNT }}

      - name: Publish a newer verified snapshot
        env:
          FIDO_SERVER_GCS_ENABLED: "1"
          FIDO_SERVER_GCS_BUCKET: pqcwebauthn
          FIDO_SERVER_GCS_PROJECT: feitian-project
          FIDO_SERVER_MDS_SNAPSHOT_DIR: ${{ runner.temp }}/mds-snapshot
        run: python tools/update_mds_snapshot.py --publish
