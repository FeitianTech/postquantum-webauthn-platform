name: Update Footer Copyright Year

on:
  schedule:
    - cron: '0 0 1 1 *'  # At 00:00 UTC on January 1st
  workflow_dispatch:

# contents: write pushes the bot branch only; main is reached through a
# reviewed pull request that runs the full CI suite.
permissions:
  contents: write
  pull-requests: write

jobs:
  update-year:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Update footer year
        run: python tools/update_footer_year.py

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- frontend/templates/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "year=$(date -u +%Y)" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a pull request with the new year
        if: steps.changes.outputs.changed == 'true'
        uses: ./.github/actions/open-bot-pr
        with:
          branch: bot/footer-year
          commit-message: "Update footer year to ${{ steps.changes.outputs.year }}"
          paths: frontend/templates/index.html
          title: "Update footer year to ${{ steps.changes.outputs.year }}"
          body: |
            Annual footer copyright roll-over, generated by
            `tools/update_footer_year.py`.

            Only `frontend/templates/index.html` is touched.
          token: ${{ secrets.BOT_PR_TOKEN || secrets.GITHUB_TOKEN }}
