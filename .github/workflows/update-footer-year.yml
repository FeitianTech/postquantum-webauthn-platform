name: Update Footer Copyright Year

on:
  schedule:
    - cron: '0 0 1 1 *'  # At 00:00 UTC on January 1st
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-year:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Update footer year
        run: |
          python3 <<'PYTHON'
          from datetime import datetime, timezone
          from pathlib import Path
          import re

          current_year = datetime.now(timezone.utc).year
          html_path = Path("server/server/static/templates/index.html")
          text = html_path.read_text(encoding="utf-8")

          pattern = re.compile(
              r"(?P<prefix>©|&copy;)\s+\d{4}\s+Feitian Technologies Co\., Ltd\."
          )

          def replace(match: re.Match) -> str:
              prefix = match.group("prefix")
              return f"{prefix} {current_year} Feitian Technologies Co., Ltd."

          updated_text, replacements = pattern.subn(replace, text, count=1)

          if replacements == 0:
              raise SystemExit("No footer year found to update.")

          if text != updated_text:
              html_path.write_text(updated_text, encoding="utf-8")
              print(f"Updated footer year to {current_year}")
          else:
              print("Footer year already up to date.")
          PYTHON

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          new_year=$(date -u +%Y)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update footer year to ${new_year}"

      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push
