name: Update Footer Copyright Year

on:
  schedule:
    - cron: '0 0 1 1 *'  # At 00:00 UTC on January 1st
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-year:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Update footer year
        run: python tools/update_footer_year.py

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          new_year=$(date -u +%Y)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update footer year to ${new_year}"

      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push
