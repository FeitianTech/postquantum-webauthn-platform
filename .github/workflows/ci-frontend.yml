name: CI / Frontend

on:
  # push is filtered to main so a same-repo PR is checked once (by
  # pull_request) instead of twice; main still gets a post-merge run.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install

      # --coverage so the thresholds in vitest.config.mjs are enforced here too.
      - name: Run frontend tests
        run: npm run test:frontend:coverage