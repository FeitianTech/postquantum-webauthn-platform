name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Build Docker image
        run: docker build -t pqc-webauthn .

      - name: Run syntax check
        run: python -m compileall .

      - name: Run import check
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "server.app.app",
              "server.app.metadata",
              "server.app.routes.advanced",
              "server.app.routes.general",
              "server.app.routes.simple",
          ]

          for module in modules:
              importlib.import_module(module)
              print(f"Imported {module}")
          PY

      - name: Run workflow updater contract tests
        run: |
          pytest -q \
            tests/app/test_update_mds_snapshot.py \
            tests/app/test_update_footer_year.py \
            tests/app/test_server_package_exports.py

      - name: Run pytest
        run: |
          pytest -v --maxfail=1 --disable-warnings -q