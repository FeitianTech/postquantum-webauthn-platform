name: CI / Python

on:
  # push is filtered to main so a same-repo PR is checked once (by
  # pull_request) instead of twice; main still gets a post-merge run.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.15"

      # Installs exactly what uv.lock pins (the same lock the Docker image
      # installs from); --locked fails if the lock is out of date.
      - name: Install dependencies
        run: |
          uv sync --locked --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Ruff is deliberately kept out of uv.lock and the venv: it is a developer
      # tool, not an application dependency. uvx runs a pinned copy on demand.
      - name: Run ruff
        run: uvx ruff@0.16.8 check --output-format github .

      - name: Run syntax check
        run: python -m compileall -x '/\.venv/' .

      - name: Run import check
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "server.app.app",
              "server.app.metadata",
              "server.app.routes.advanced",
              "server.app.routes.general",
              "server.app.routes.simple",
          ]

          for module in modules:
              importlib.import_module(module)
              print(f"Imported {module}")
          PY

      # Run under coverage so the fail_under floor in .coveragerc is enforced on
      # every push and PR, not only when the badge workflow runs on main.
      - name: Run pytest with coverage
        run: |
          coverage run -m pytest --maxfail=1 --disable-warnings -q -p no:cov
          coverage report -m