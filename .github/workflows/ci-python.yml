name: CI / Python

on:
  # push is filtered to main so a same-repo PR is checked once (by
  # pull_request) instead of twice; main still gets a post-merge run.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.12.15"

      # Installs exactly what uv.lock pins (the same lock the Docker image
      # installs from); --locked fails if the lock is out of date.
      - name: Install dependencies
        run: |
          uv sync --locked --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Ruff is deliberately kept out of uv.lock and the venv: it is a developer
      # tool, not an application dependency. uvx runs a pinned copy on demand.
      - name: Run ruff
        run: uvx ruff@0.16.8 check --output-format github .

      - name: Run syntax check
        run: python -m compileall -x '/\.venv/' .

      - name: Run import check
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "server.app.app",
              "server.app.webauthn.attestation.checks",
              "server.app.mds.verifier",
              "server.app.decoder.decode.text",
              "server.app.decoder.encode.text",
              "server.app.storage.credentials",
              "server.app.routes.advanced.artifacts",
              "server.app.routes.advanced.authentication",
              "server.app.routes.advanced.registration",
              "server.app.routes.assets",
              "server.app.routes.csp_report",
              "server.app.routes.codec",
              "server.app.routes.mds",
              "server.app.routes.simple.authentication",
              "server.app.routes.simple.registration",
              "server.app.routes.web_export",
          ]

          for module in modules:
              importlib.import_module(module)
              print(f"Imported {module}")
          PY

      # Under coverage, so .coveragerc's fail_under floor holds on every push and PR.
      - name: Run pytest with coverage
        run: |
          coverage run -m pytest --maxfail=1 --disable-warnings -q -p no:cov
          coverage report -m