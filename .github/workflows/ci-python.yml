name: CI / Python

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.15"

      # Installs exactly what uv.lock pins (the same lock the Docker image
      # installs from); --locked fails if the lock is out of date.
      - name: Install dependencies
        run: |
          uv sync --locked --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run syntax check
        run: python -m compileall -x '/\.venv/' .

      - name: Run import check
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "server.app.app",
              "server.app.metadata",
              "server.app.routes.advanced",
              "server.app.routes.general",
              "server.app.routes.simple",
          ]

          for module in modules:
              importlib.import_module(module)
              print(f"Imported {module}")
          PY

      - name: Run pytest
        run: pytest -v --maxfail=1 --disable-warnings -q