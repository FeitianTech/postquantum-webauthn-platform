# Ruff configuration for the whole repository.
#
# This lives in a standalone ruff.toml rather than in the root pyproject.toml
# because that file is the vendored `fido2/` library's upstream Poetry manifest.
# Repo-wide tooling policy does not belong in a vendored manifest, and keeping
# it out means the manifest stays diffable against upstream python-fido2.

# The app and the vendored library both declare requires-python >= 3.12
# (server/pyproject.toml and pyproject.toml), so PEP 585/604 syntax is valid
# everywhere and the UP modernisation rules are safe to apply.
target-version = "py312"

[lint.per-file-ignores]
# F401 is structurally wrong in the five "parent" modules of the split-module
# layout. Each one is a namespace carrier for its `*_parts/` fragments:
#
#   * attestation.py, decoder/decode.py and metadata.py rebuild fragment
#     functions with `types.FunctionType(func.__code__, globals(), ...)`, so the
#     parent's module globals are the namespace those functions resolve against;
#   * routes/advanced.py and routes/simple.py pass themselves (`_self_module()`)
#     into their fragments, which then read names straight off the module
#     (e.g. `advanced_module.request.get_json(...)`).
#
# Either way the parent imports names its own body never mentions, ruff reports
# them unused, and deleting them breaks the app at runtime. UP035 is ignored
# here for the same reason: the fragments still write `Dict`/`List`/`Set`/
# `Tuple` and resolve them through the parent, so the parent has to keep the
# legacy `typing` names until those fragments can import their own. This is the
# same debt F821 tracks (see the note at the bottom of this file) and it is
# retired in the same milestone, not by suppressing it name by name here.
#
# F822 is ignored in the two modules that carry an `__all__`, for the same
# reason and after checking every entry: all 26 names ruff calls undefined are
# installed into the module globals at import time by
# `_install_runtime_bindings(...)`. `hasattr()` and `from <mod> import *` both
# resolve all 26, so none of them is a real broken export.
"server/app/attestation.py" = ["F401", "UP035", "F822"]
"server/app/decoder/decode.py" = ["F401", "UP035"]
"server/app/metadata.py" = ["F401", "UP035", "F822"]
"server/app/routes/advanced.py" = ["F401", "UP035"]
"server/app/routes/simple.py" = ["F401", "UP035"]
