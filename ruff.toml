# Ruff configuration for the whole repository.
#
# This lives in a standalone ruff.toml rather than in the root pyproject.toml
# because that file is the vendored `fido2/` library's upstream Poetry manifest.
# Repo-wide tooling policy does not belong in a vendored manifest, and keeping
# it out means the manifest stays diffable against upstream python-fido2.

# The app and the vendored library both declare requires-python >= 3.12
# (server/pyproject.toml and pyproject.toml), so PEP 585/604 syntax is valid
# everywhere and the UP modernisation rules are safe to apply.
target-version = "py312"

[lint]
# The gated set: every rule here is at zero today and is one we are confident
# stays at zero. CI fails the build on any violation (.github/workflows/ci-python.yml).
#
#   E4/E7/E9  import placement, statement-level errors, syntax errors
#   F         pyflakes -- undefined names, unused imports, broken __all__, dead locals
#   I         import sorting
#   UP006/UP007/UP035/UP045  PEP 585/604 typing, valid because the floor is 3.12
#
# Deliberately NOT gated, and why:
#   BLE001 (175), S110 (21), S112 (11)  reconnaissance only. A read of 32 of the
#     S110/S112 sites and a 20-site BLE001 sample put roughly 4 in 5 in the
#     "load-bearing defensive handler" bucket and the rest in "silently swallows
#     a failure". Splitting them needs a human decision per site, so they stay
#     out of the gate rather than being mass-rewritten or mass-suppressed.
#   RUF100 (86)  its answer depends on which rules are selected, and with a gate
#     this narrow it calls 79 live markers dead: the blanket `# noqa` on long
#     fixture lines (E501 is not gated), `# noqa: S101` in tests, and the
#     `# noqa: F401` re-export markers in vendored `fido2/**/__init__.py`, which
#     ruff only skips because `ignore-init-module-imports` still defaults to
#     true and which come back the moment that deprecated default is dropped.
#     Deleting them would be churn against upstream that we would have to undo.
#     The 7 that were genuinely stale have been removed by hand.
#   The rest of UP, plus B/C4/SIM/RUF012/TRY/DTZ/...  all still have findings.
#     They are worth adopting, but one rule group at a time with the suite green.
select = ["E4", "E7", "E9", "F", "I", "UP006", "UP007", "UP035", "UP045"]

# F821 stays off on purpose. The remaining 557 hits come from the split-module
# runtime hack described under [lint.per-file-ignores] below: attestation.py and
# decoder/decode.py rebuild their fragments' functions against the parent's
# globals, so the fragments genuinely do not import the names they use, and
# those `*_parts/` files are undefined-name soup by design. Turning F821 on now
# would mean 557 permanent suppressions and would destroy the one number that
# tells us whether the hack is being unwound. It is our progress meter: it comes
# on, unsuppressed, in the milestone that removes the last rebinding.
#
# It was 1008 until metadata.py was unwound. `server/app/metadata_parts/` is at
# zero and stays there: every fragment resolves its own names through real
# imports, and the shared caches live in `metadata_parts/runtime_state.py`.
# Measure progress with:
#   uvx ruff@0.16.8 check server fido2 tools --select F821 --no-cache \
#     --isolated --target-version py312 | grep -c F821
ignore = ["F821"]

[lint.per-file-ignores]
# F401 is structurally wrong in the four remaining "parent" modules of the
# split-module layout. Each one is a namespace carrier for its `*_parts/`
# fragments:
#
#   * attestation.py and decoder/decode.py rebuild fragment functions with
#     `types.FunctionType(func.__code__, globals(), ...)`, so the parent's module
#     globals are the namespace those functions resolve against;
#   * routes/advanced.py and routes/simple.py pass themselves (`_self_module()`)
#     into their fragments, which then read names straight off the module
#     (e.g. `advanced_module.request.get_json(...)`).
#
# Either way the parent imports names its own body never mentions, ruff reports
# them unused, and deleting them breaks the app at runtime. UP035 is ignored
# here for the same reason: the fragments still write `Dict`/`List`/`Set`/
# `Tuple` and resolve them through the parent, so the parent has to keep the
# legacy `typing` names until those fragments can import their own. This is the
# same debt F821 tracks (see the `ignore` note above) and it is
# retired in the same milestone, not by suppressing it name by name here.
#
# F822 is ignored in attestation.py, for the same reason and after checking
# every entry: the names ruff calls undefined are installed into the module
# globals at import time by `_install_runtime_bindings(...)`. `hasattr()` and
# `from <mod> import *` both resolve them, so none is a real broken export.
#
# metadata.py used to need all three. It no longer does: it is a thin re-export
# of `metadata_parts`, every name in its `__all__` is a plain assignment, and
# nothing it imports is unused.
"server/app/attestation.py" = ["F401", "UP035", "F822"]
"server/app/decoder/decode.py" = ["F401", "UP035"]
"server/app/routes/advanced.py" = ["F401", "UP035"]
"server/app/routes/simple.py" = ["F401", "UP035"]
