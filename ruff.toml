# Ruff configuration for the whole repository.
#
# A standalone ruff.toml: pyproject.toml holds only the app's dependencies, and
# ruff is kept out of uv.lock (CI runs `uvx ruff@0.16.8`).

# requires-python >= 3.12 (pyproject.toml): PEP 585/604 syntax is valid everywhere.
target-version = "py312"

[lint]
# The gated set, at zero: .github/workflows/ci-python.yml fails on any violation.
#
#   E4/E7/E9  import placement, statement-level errors, syntax errors
#   F         pyflakes: undefined names (F821 too, with nothing ignored), unused
#             imports, dead locals
#   I         import sorting
#   UP006/UP007/UP035/UP045  PEP 585/604 typing
#
# There is no per-file ignore, and no package re-exports a name, so no `# noqa: F401`.
#
# Not gated, with findings today (ruff 0.16.8):
#   BLE001 (96), S110 (4), S112 (5)  broad handlers. Most are deliberate (the
#     decoder showing what it cannot read, for one), so each needs a decision of
#     its own, not a rewrite or a suppression in bulk.
#   RUF100 (8)  with a gate this narrow it calls a marker for a rule outside the
#     gate unused: the blanket `# noqa` on python_fido2_vectors.py's long lines
#     (E501 is not gated) and the updater's `# noqa: S310`.
#   The rest of UP, and B, C4, SIM, RUF, TRY, DTZ  findings remain; adopt one
#     group at a time with the suite green.
select = ["E4", "E7", "E9", "F", "I", "UP006", "UP007", "UP035", "UP045"]
