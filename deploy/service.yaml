# Cloud Run service definition for pqcwebauthn (asia-northeast1).
#
# Apply with deploy/apply-service-config.sh, which substitutes the image serving
# the traffic for IMAGE_PLACEHOLDER. Pushes to main only update the image
# (see cloudbuild.yaml, deploy/deploy-revision.sh), so settings in this file
# persist across deploys.
#
# Secrets are referenced from Secret Manager; never put secret values here.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: pqcwebauthn
  labels:
    cloud.googleapis.com/location: asia-northeast1
  annotations:
    run.googleapis.com/ingress: all
    # The site is public because the invoker IAM check is off: the service has no
    # IAM bindings, not even allUsers. `services replace` resets an annotation
    # this file leaves out, so without this line applying the file answers 403
    # to every visitor.
    run.googleapis.com/invoker-iam-disabled: "true"
spec:
  template:
    metadata:
      annotations:
        # gen1 starts small containers faster; revisit with a tagged gen2 revision.
        run.googleapis.com/execution-environment: gen1
        run.googleapis.com/startup-cpu-boost: "true"
        # Request-based billing: CPU is only allocated while serving requests and probes.
        run.googleapis.com/cpu-throttling: "true"
        # No instance is kept between visits: an idle one is billed only for its
        # liveness probes, and a visit after a quiet spell meets a cold start.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      serviceAccountName: pqcwebauthn-run@feitian-project.iam.gserviceaccount.com
      # One instance serves a whole page load (HTML plus its static assets);
      # matches GUNICORN_THREADS below.
      containerConcurrency: 16
      timeoutSeconds: 300
      containers:
        - image: IMAGE_PLACEHOLDER
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              # One gunicorn worker runs the app; startup CPU boost covers a start.
              cpu: "1"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: 8080
            timeoutSeconds: 240
            periodSeconds: 240
            failureThreshold: 1
          # /health needs one free thread of the 16: four misses in a row, two
          # minutes, mean none has freed up, and Cloud Run kills the instance (its
          # requests in flight answer 503) and starts another. A busy instance
          # answers within seconds. The delay lets a slow start provision its MDS
          # snapshot. Each probe is billed for its own CPU and memory, which is little.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          env:
            # Passkeys belong to webauthndev.com: a ceremony from any other origin,
            # the run.app URL among them, is refused.
            - name: FIDO_SERVER_RP_ID
              value: webauthndev.com
            - name: FIDO_SERVER_ALLOWED_ORIGINS
              value: https://webauthndev.com
            - name: FIDO_SERVER_GCS_ENABLED
              value: "true"
            - name: FIDO_SERVER_GCS_BUCKET
              value: pqcwebauthn
            - name: FIDO_SERVER_GCS_PROJECT
              value: feitian-project
            - name: GUNICORN_THREADS
              value: "16"
            - name: FIDO_SERVER_BACKGROUND_WARMUP
              value: "1"
            - name: GITHUB_HTTP_TIMEOUT_SECONDS
              value: "4"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pqcwebauthn-github-token
                  key: latest
            - name: FIDO_SERVER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: pqcwebauthn-session-key
                  key: latest
