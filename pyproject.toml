[tool.poetry]
name = "fido2"
version = "1.2.1-dev.0"
description = "FIDO2/WebAuthn library for implementing clients and servers."
authors = ["Dain Nilsson <dain@yubico.com>"]
homepage = "https://github.com/Yubico/python-fido2"
repository = "https://github.com/Yubico/python-fido2"
keywords = ["fido2", "webauthn", "ctap", "u2f"]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Internet",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
include = [
  { path = "COPYING", format = "sdist"},
  { path = "COPYING.MPLv2", format = "sdist"},
  { path = "COPYING.APLv2", format = "sdist"},
  { path = "README.md", format = "sdist"},
  { path= "server/", format = "sdist"},
]

[tool.poetry.dependencies]
python = "^3.12"
cryptography = ">=49"      # native ML-DSA-44/65/87 sign/verify and ML-DSA x509
pyscard = {version = "^1.9 || ^2", optional = true}

cbor2 = "^5.6.4"           # CBOR parsing

[tool.poetry.extras]
pcsc = ["pyscard"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


# The application (server/) is the only workspace member; the lock lives at /uv.lock.
[tool.uv.workspace]
members = ["server"]
