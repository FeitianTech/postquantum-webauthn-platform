# The application's dependency manifest and the single place its dependencies
# are declared. Resolved versions are locked in uv.lock, which the Docker
# image, CI and local venvs all install from. After editing, run `uv lock`.

[project]
name = "pqc-webauthn-platform"
version = "0.1.0"
description = "FIDO2/WebAuthn post-quantum test platform"
authors = [{ name = "Rain Zhang", email = "rainzhang.zty@gmail.com" }]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fido2==2.2.1",                       # exact: the app reads fido2's data classes and CTAP tables
    "Flask>=3.1.3,<4",
    "Werkzeug>=3.1",                      # imported directly (ProxyFix, exceptions, safe_join)
    "itsdangerous>=2.2",                  # imported directly (the MDS session cookie)
    "cryptography>=50",                   # the release the ML-DSA code is tested with
    "cbor2>=5.6.4",
    "gunicorn>=26.2.0,<27",
    "google-api-core>=2.38.0",
    "google-cloud-storage>=3.14.1",
]

[dependency-groups]
dev = [
    "pytest",
    "coverage",
    "hypothesis",                         # the codec's round-trip property tests
]

[tool.uv]
# Not a distributable package: the app runs from source (gunicorn server.app.app:app),
# so uv installs only its dependencies.
package = false
