services:
  webauthn:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: WebAuthnServer
    # This machine only: a local server is for its own browser.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PORT: "8000"
    volumes:
      - instance:/app/instance
    restart: unless-stopped

# The container's user (uid 10001) owns /app/instance. A named volume starts as the
# image's folder, owned by that user; a bind mount of ./instance belongs to the host's.
volumes:
  instance:
